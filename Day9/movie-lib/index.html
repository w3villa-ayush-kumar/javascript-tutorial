<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Movie Library</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Movie Library</h1>

    <input id="title" placeholder="Movie title" />
    <input id="rating" type="number" placeholder="Rating (1-10)" />
    <input id="genre" placeholder="Genre" />
    <button id="addMovie">Add</button>

    <br /><br />

    <button id="filterHigh">Top Rated</button>
    <button id="showAll">All Movies</button>

    <p>Click on movies to delete it</p>
    <ul id="movieList"></ul>

    <script src="script.js"></script>
  </body>
</html>
